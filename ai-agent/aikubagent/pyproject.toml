[project]
name = "aikubagent"
version = "0.1.0"
description = "aiKubAgent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]",
    "flask>=3.1.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2"
]

[project.scripts]
aikubagent = "aikubagent.main:run"
run_crew = "aikubagent.main:run"
train = "aikubagent.main:train"
replay = "aikubagent.main:replay"
test = "aikubagent.main:test"
run_with_trigger = "aikubagent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
