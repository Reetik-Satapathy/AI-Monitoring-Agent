analyze_incident:
  description: >
    Analyze the following production incident.

    Alert Name: {alert_name}

    Severity: {severity}

    Service: {service}

    Summary: {summary}

    Description: {description}

  expected_output: >
    A concise incident report containing:

    - Incident summary
    - Severity assessment
    - Possible impact
    - Likely causes
    - First troubleshooting step