analyze_incident:
  description: >
    Analyze the following production incident.

    Alert Name: {alert_name}

    Severity: {severity}

    Service: {service}

    Summary: {summary}

    Description: {description}

    Request Rate: {request_rate} req/sec

    Average Request Duration: {avg_request_duration} sec

    Active Requests: {active_requests}

    Homepage Visits: {homepage_visits}

    Contact Form Submissions: {contact_submissions}

  expected_output: >
    A concise incident report containing:

    - Incident summary
    - Severity assessment
    - Possible impact
    - Likely causes
    - First troubleshooting step

