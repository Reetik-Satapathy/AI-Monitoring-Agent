apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-agent
  namespace: ai-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-agent

  template:
    metadata:
      labels:
        app: ai-agent

    spec:
      serviceAccountName: ai-agent
      containers:
        - name: ai-agent

          image: ai-agent:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: ai-agent-config

            - secretRef:
                name: ai-agent-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 15