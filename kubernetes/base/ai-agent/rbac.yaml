apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-reader
  namespace: ai-platform

rules:
- apiGroups: [""]
  resources:
    - pods
    - services
    - endpoints
    - events
    - configmaps
  verbs:
    - get
    - list
    - watch

- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - statefulsets
    - daemonsets
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-reader
  namespace: ai-platform

subjects:
- kind: ServiceAccount
  name: ai-agent

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-agent-reader